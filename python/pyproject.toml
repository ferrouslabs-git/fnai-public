[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fnai"
version = "0.8.0"
description = "Python client for functionalAI — invoke deployed functions and drive the management API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ferrous Labs" }]
keywords = ["functionalAI", "fnai", "llm", "ai-functions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies (stdlib only) for the core `fnai` module.
dependencies = []

# Opt-in only: pip install "fnai[mcp] @ git+https://github.com/ferrouslabs-git/fnai-public.git#subdirectory=python"
# for the local MCP stdio server (fnai_mcp.py). Keeps the core client
# dependency-free for everyone else.
[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
fnai-mcp = "fnai_mcp:main"
fn = "fn_cli:main"

[project.urls]
Homepage = "https://github.com/ferrouslabs-git/fnai-public"
Repository = "https://github.com/ferrouslabs-git/fnai-public"
Issues = "https://github.com/ferrouslabs-git/fnai-public/issues"

[tool.setuptools]
py-modules = ["fnai", "fnai_mcp", "fn_cli"]

# Ship the task guide with the install (pip install fnai -> share/fnai/GUIDE.md).
[tool.setuptools.data-files]
"share/fnai" = ["GUIDE.md", "AGENTS.md"]
